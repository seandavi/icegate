<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iceberg Catalog Explorer</title>
<meta name="description" content="Browse any Iceberg REST catalog served through icegate: namespaces, tables, column docs, schema stats and snapshot history, read live and anonymously.">
<link rel="stylesheet" href="style.css">
<!--
  The query tab needs this: DuckDB-WASM's browser build imports the bare
  specifier "apache-arrow", which only resolves via an import map, and an
  import map must be present before any module script runs.
-->
<script type="importmap">
{ "imports": { "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/+esm" } }
</script>
</head>
<body>
<header>
  <h1>Iceberg Catalog Explorer</h1>
  <span class="sub" id="catalog-sub"></span>
  <div id="switcher"></div>
</header>

<main id="directory-main" hidden>
  <section id="view-directory"></section>
</main>

<div id="view-browse" class="layout" hidden>
  <nav id="catalog" aria-label="Namespaces and tables">
    <h2>Namespaces</h2>
    <div id="catalog-tree"></div>
  </nav>
  <main id="main"><div id="table-view"></div></main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
