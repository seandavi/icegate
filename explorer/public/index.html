<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icegate explorer</title>
<meta name="description" content="Browse any Iceberg REST catalog served through icegate: namespaces, tables, column docs, schema stats and snapshot history, read live and anonymously.">
<script>
  // Apply a stored theme override before first paint, so there's no flash of
  // the wrong theme. Runs before the stylesheet link; app.js is a deferred
  // module and would run too late for this.
  try {
    var t = localStorage.getItem("icegate_explorer_theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch {}
</script>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%234a8dff" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4.2 6l15.6 12M4.2 18L19.8 6M12 4.4l-1.8 1.6M12 4.4l1.8 1.6M12 19.6l-1.8-1.6M12 19.6l1.8-1.6M5.8 7.4l.3 2.3M5.8 7.4l2.2-.8M18.2 16.6l-.3-2.3M18.2 16.6l-2.2.8M18.2 7.4l-2.2-.8M18.2 7.4l-.3 2.3M5.8 16.6l2.2.8M5.8 16.6l.3-2.3"/></svg>'>
<link rel="stylesheet" href="style.css">
<!--
  The query tab needs this: DuckDB-WASM's browser build imports the bare
  specifier "apache-arrow", which only resolves via an import map, and an
  import map must be present before any module script runs.
-->
<script type="importmap">
{ "imports": { "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/+esm" } }
</script>
</head>
<body>
<header>
  <h1 class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false">
      <path d="M12 2v20M4.2 6l15.6 12M4.2 18L19.8 6
               M12 4.4l-1.8 1.6M12 4.4l1.8 1.6M12 19.6l-1.8-1.6M12 19.6l1.8-1.6
               M5.8 7.4l.3 2.3M5.8 7.4l2.2-.8M18.2 16.6l-.3-2.3M18.2 16.6l-2.2.8
               M18.2 7.4l-2.2-.8M18.2 7.4l-.3 2.3M5.8 16.6l2.2.8M5.8 16.6l.3-2.3" />
    </svg>
    <span>icegate explorer</span>
  </h1>
  <span class="sub" id="catalog-sub"></span>
  <div id="switcher"></div>
</header>

<main id="directory-main" class="prose-width" hidden>
  <section id="view-directory"></section>
</main>

<div id="view-browse" class="layout" hidden>
  <nav id="catalog" aria-label="Namespaces and tables">
    <div id="catalog-tree"></div>
  </nav>
  <main id="main" class="prose-width"><div id="table-view"></div></main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
